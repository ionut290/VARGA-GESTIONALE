name: Deploy Google Apps Script bridge

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'google-apps-script-map-bridge.gs'
      - 'google-apps-script-depurazione-dual-drive.gs'
      - 'appsscript.json'
      - '.claspignore'
      - '.github/workflows/apps-script-deploy.yml'

permissions:
  contents: read

env:
  APPS_SCRIPT_ID: '1guh1Wfm6Qhto_hl7NxeA4z9IZnHr6Bt8XrW_LIkjkUlUM_3UhgBh7M9c'
  APPS_SCRIPT_DEPLOYMENT_ID: 'AKfycbyeendkbDj_CldTfhSJhWQvQSnr8KNd2IoDWx1VG6210Uhaox99M4rbUwo8nFms046A'

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Check deploy configuration
        id: config
        shell: bash
        env:
          CLASPRC_JSON: ${{ secrets.CLASPRC_JSON }}
        run: |
          if [ -n "$CLASPRC_JSON" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "Deploy Apps Script non eseguito: configurare il solo secret CLASPRC_JSON."
          fi

      - name: Checkout
        if: steps.config.outputs.ready == 'true'
        uses: actions/checkout@v4

      - name: Setup Node
        if: steps.config.outputs.ready == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install clasp
        if: steps.config.outputs.ready == 'true'
        run: npm install -g @google/clasp@3

      - name: Configure Apps Script project
        if: steps.config.outputs.ready == 'true'
        shell: bash
        env:
          CLASPRC_JSON: ${{ secrets.CLASPRC_JSON }}
        run: |
          printf '{"scriptId":"%s","rootDir":"."}\n' "$APPS_SCRIPT_ID" > .clasp.json
          printf '%s' "$CLASPRC_JSON" > "$HOME/.clasprc.json"
          chmod 600 "$HOME/.clasprc.json"

      - name: Verify files
        if: steps.config.outputs.ready == 'true'
        run: clasp show-file-status

      - name: Push Apps Script sources
        if: steps.config.outputs.ready == 'true'
        run: clasp push --force

      - name: Create immutable Apps Script version
        if: steps.config.outputs.ready == 'true'
        id: version
        shell: bash
        run: |
          OUT=$(clasp create-version "Varga Gestionale ${GITHUB_SHA}")
          echo "$OUT"
          VER=$(echo "$OUT" | grep -oE '[0-9]+' | tail -1)
          test -n "$VER"
          echo "version=$VER" >> "$GITHUB_OUTPUT"

      - name: Preserve manual Web App deployment
        if: steps.config.outputs.ready == 'true'
        run: echo "Sorgenti Apps Script aggiornate. Il deployment Web App manuale resta invariato."
