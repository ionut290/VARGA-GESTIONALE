name: Varga Gestionale Oracle pilot — test only
on:
  pull_request:
    paths:
      - 'oracle/**'
      - '.github/workflows/oracle-gestionale-ci.yml'
  push:
    paths:
      - 'oracle/**'
      - '.github/workflows/oracle-gestionale-ci.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  unit-tests:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: vg_test
          POSTGRES_PASSWORD: local_ci_test_only
          POSTGRES_DB: vg_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U vg_test -d vg_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://vg_test:local_ci_test_only@127.0.0.1:5432/vg_test
    defaults:
      run:
        working-directory: oracle
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install test dependencies
        run: python -m pip install -r requirements.txt
      - name: Test Oracle API and snapshot export
        run: python -m unittest discover -s tests -v
      - name: Syntax-check browser export, API client and installer
        run: |
          node --check ../app.js
          node --check client.js
          node --check browser-export.js
          bash -n install_on_vm.sh
          bash -n preflight.sh
          bash -n diagnose_vm.sh
          bash -n verify_deployment.sh
          bash -n stage_backup.sh
          bash -n compare_staging.sh
          bash -n repair_web_export.sh
          python -m py_compile verify_backup.py
          python -m py_compile compare_backups.py
          python -m py_compile compare_backup_fields.py
          python -m py_compile audit_live_export.py
          python -m py_compile audit_three_way.py
      - name: Integration test against temporary PostgreSQL
        run: python -m unittest discover -s integration_tests -v
      - name: Validate schema and Compose YAML (without deployment)
        run: |
          python - <<'PY'
          from pathlib import Path
          assert Path("schema.sql").exists()
          assert Path("compose.yaml").exists()
          assert Path("backend/main.py").exists()
          assert Path("export_firestore.py").exists()
          print("Static source checks passed. NO SERVER DEPLOYMENT.")
          PY
