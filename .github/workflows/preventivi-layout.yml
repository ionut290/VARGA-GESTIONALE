name: Verifica impaginazione preventivi
on:
  pull_request:
    paths:
      - 'preventivi-*.js'
      - 'app.js'
      - 'app-business.js'
      - 'tests/quote-*'
      - '.github/workflows/preventivi-layout.yml'
permissions:
  contents: read
jobs:
  pdf:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - name: Dipendenze per test isolati
        run: |
          mkdir -p /tmp/quote-deps
          npm install --prefix /tmp/quote-deps --ignore-scripts --no-audit --no-fund pdf-lib@1.17.1
          python3 -m venv /tmp/quote-python
          /tmp/quote-python/bin/pip install pymupdf==1.26.7 pillow==11.3.0
          sudo apt-get update -qq
          sudo apt-get install -y poppler-utils
      - name: Sintassi e generatore con dati fittizi
        run: |
          node --check preventivi-layout.js
          node --check preventivi-avola.js
          node --check app-business.js
          node --check app.js
          NODE_PATH=/tmp/quote-deps/node_modules node tests/quote-layout.test.cjs
      - name: Verifica PDF statici e compilabili in due motori
        run: /tmp/quote-python/bin/python tests/quote-render-test.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: quote-layout-results
          path: build/quote-output
