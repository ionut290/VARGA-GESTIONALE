name: Verifica impaginazione preventivi
on:
  pull_request:
    paths:
      - 'preventivi-*.js'
      - 'app.js'
      - 'tests/quote-*'
      - '.github/workflows/preventivi-layout.yml'
permissions:
  contents: read
jobs:
  pdf:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - name: Libreria PDF per test isolati
        run: |
          mkdir -p /tmp/quote-deps
          npm install --prefix /tmp/quote-deps --ignore-scripts --no-audit --no-fund pdf-lib@1.17.1
          mkdir -p build/quote-test-tools
          cp /tmp/quote-deps/node_modules/pdf-lib/dist/pdf-lib.min.js build/quote-test-tools/
          cp /tmp/quote-deps/node_modules/pdf-lib/LICENSE.md build/quote-test-tools/
      - name: Prova generatore su dati fittizi
        run: |
          if [ -f tests/quote-layout.test.cjs ]; then
            NODE_PATH=/tmp/quote-deps/node_modules node tests/quote-layout.test.cjs
          else
            echo 'Preparazione dipendenze; test layout non ancora aggiunti. Nessuna verifica grafica dichiarata.'
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: quote-layout-results
          path: build/quote-*
