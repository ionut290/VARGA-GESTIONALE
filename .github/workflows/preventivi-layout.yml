name: Verifica impaginazione preventivi
on:
  pull_request:
    paths:
      - 'preventivi-*.js'
      - 'app.js'
      - 'tests/quote-*'
      - '.github/workflows/preventivi-layout.yml'
permissions:
  contents: read
jobs:
  pdf:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - name: Libreria PDF per test isolati
        run: |
          mkdir -p /tmp/quote-deps
          npm install --prefix /tmp/quote-deps --ignore-scripts --no-audit --no-fund pdf-lib@1.17.1
      - name: Sintassi e 40 verifiche su dati fittizi
        run: |
          node --check preventivi-pdf-layout.js
          node --check preventivi-pdf-integration.js
          node --check app.js
          NODE_PATH=/tmp/quote-deps/node_modules node tests/quote-layout.test.cjs
          NODE_PATH=/tmp/quote-deps/node_modules node tests/quote-integration.test.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: quote-layout-results
          path: build/quote-output
